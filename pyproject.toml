[project]
name = "exasol-sqlglot-toolbox"
version = "0.1.0"
description = "An extension and toolbox to the Exasol dialect in SQLglot"
authors = [{ name = "Exasol AG", email = "opensource@exasol.com" }]
requires-python = ">=3.10,<3.14"
readme = "README.rst"
license = "MIT"
keywords = [
    "exasol",
    "sqlglot_toolbox",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["sqlglot==28.5.0"]

[dependency-groups]
dev = [
    "pyexasol>=2.0.0,<3",
    "pytest-exasol-backend>=1.2.4,<2",
    "exasol-toolbox>=8.2.0,<9",
]

[tool.poetry]
requires-poetry = ">=2.1.0"
packages = [
       { include = "exasol" },
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[poetry.urls]
repository = "https://github.com/exasol/sqlglot-toolbox"
homepage = "https://github.com/exasol/sqlglot-toolbox"

[tool.coverage.run]
relative_files = true
source = [
    "exasol",
]

[tool.coverage.report]
fail_under = 15

[tool.black]
line-length = 88
verbose = false
include = "\\.pyi?$"

[tool.isort]
profile = "black"
force_grid_wrap = 2

[tool.pylint.master]
fail-under = 5.0
ignore = []

[tool.pylint.format]
max-line-length = 88
max-module-lines = 800

[tool.ruff.lint]
extend-ignore = [
    "E",      # Syntax errors
    "F",      # Pyflakes rules (excluding F401)
    "UP",     # pyupgrade rules
    "D",      # Docstring rules
]
extend-select = ["F401"]
unfixable = []

[[tool.mypy.overrides]]
module = [
    "test.*",
]
ignore_errors = true

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.sonar]
projectKey = "com.exasol:sqlglot-toolbox"
host.url = "https://sonarcloud.io"
organization = "exasol"
